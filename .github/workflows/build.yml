name: build-vkshim
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Finds ANY .zip in the repo (any name, any folder), unzips the newest one that contains the
      # project (a folder with CMakeLists.txt + src/shim.cpp, even if nested). If there is no such
      # zip, the loose files in the repo are used instead.
      - name: Find and unpack project
        run: |
          set -e
          WORK="$RUNNER_TEMP/unzipped"
          mkdir -p "$WORK"
          git ls-files -z -- '*.zip' '*.ZIP' | while IFS= read -r -d '' f; do
            printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$f")" "$f"
          done | sort -t"$(printf '\t')" -k1,1nr | cut -f2- > "$RUNNER_TEMP/zips.txt"
          echo "zip files found in repo (newest first):"
          cat "$RUNNER_TEMP/zips.txt" || true
          PROJ=""
          SRC="loose repo files"
          while IFS= read -r z; do
            [ -n "$z" ] || continue
            d="$WORK/$(printf '%s' "$z" | md5sum | cut -c1-8)"
            mkdir -p "$d"
            if ! unzip -q -o "$z" -d "$d"; then echo "could not unzip $z, skipping"; continue; fi
            c=$(find "$d" -name CMakeLists.txt | while IFS= read -r f; do
                  dir=$(dirname "$f")
                  if [ -f "$dir/src/shim.cpp" ]; then echo "$dir"; break; fi
                done)
            if [ -n "$c" ]; then PROJ="$c"; SRC="$z"; break; fi
            echo "no project found inside $z, skipping"
          done < "$RUNNER_TEMP/zips.txt"
          if [ -z "$PROJ" ]; then
            if [ -f src/shim.cpp ] && [ -f CMakeLists.txt ]; then PROJ="$GITHUB_WORKSPACE"
            else echo "ERROR: no zip with the project and no loose project files in the repo"; exit 1; fi
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "SRC_USED=$SRC" >> "$GITHUB_ENV"
          echo "=============================================="
          echo "BUILDING FROM: $SRC"
          echo "PROJECT DIR:   $PROJ"
          echo "shim.cpp lines: $(wc -l < "$PROJ/src/shim.cpp")"
          echo "version marker in shim.cpp: $(grep -o 'vkshim build: [A-Za-z0-9._-]*' "$PROJ/src/shim.cpp" | head -1)"
          echo "shim.cpp sha256: $(sha256sum "$PROJ/src/shim.cpp" | cut -c1-16)"
          echo "=============================================="

      - name: Fetch libadrenotools
        run: |
          cd "$PROJ"
          rm -rf libadrenotools
          git clone --recursive https://github.com/bylaws/libadrenotools.git libadrenotools

      - name: Regenerate trampolines
        run: |
          cd "$PROJ"
          python3 tools/gen.py

      - name: Configure + build
        run: |
          cd "$PROJ"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      - name: Collect output
        run: |
          cd "$PROJ"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          STRIP=$(ls $NDK/toolchains/llvm/prebuilt/*/bin/llvm-strip)
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT/lib/arm64-v8a"
          find build -name "*.so" -not -path "*/CMakeFiles/*" -exec cp -v {} "$OUT/lib/arm64-v8a/" \;
          for f in "$OUT"/lib/arm64-v8a/*.so; do $STRIP --strip-unneeded "$f"; done
          ls -la "$OUT/lib/arm64-v8a" | tee "$OUT/BUILD_LISTING.txt"
          READELF=$(ls $NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          $READELF -d "$OUT/lib/arm64-v8a/libvkshim.so" | tee "$OUT/shim_dynamic.txt"
          $READELF --dyn-syms "$OUT/lib/arm64-v8a/libvkshim.so" | grep -c " vk" | tee "$OUT/exported_vk_count.txt"
          {
            echo "built from: $SRC_USED"
            echo "version marker: $(grep -o 'vkshim build: [A-Za-z0-9._-]*' "$PROJ/src/shim.cpp" | head -1)"
            echo "shim.cpp sha256: $(sha256sum "$PROJ/src/shim.cpp" | cut -c1-16)"
            echo "libvkshim.so size: $(stat -c %s "$OUT/lib/arm64-v8a/libvkshim.so") bytes (old v2 build was 196744)"
          } | tee "$OUT/SOURCE_USED.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: vkshim-arm64
          path: dist
