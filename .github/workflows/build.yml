name: build-vkshim
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch libadrenotools
        run: git clone --recursive https://github.com/bylaws/libadrenotools.git libadrenotools
      - name: Regenerate trampolines
        run: python3 tools/gen.py
      - name: Configure + build
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Collect output
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          STRIP=$(ls $NDK/toolchains/llvm/prebuilt/*/bin/llvm-strip)
          mkdir -p dist/lib/arm64-v8a
          find build -name "*.so" -not -path "*/CMakeFiles/*" -exec cp -v {} dist/lib/arm64-v8a/ \;
          for f in dist/lib/arm64-v8a/*.so; do $STRIP --strip-unneeded "$f"; done
          ls -la dist/lib/arm64-v8a | tee dist/BUILD_LISTING.txt
          READELF=$(ls $NDK/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          $READELF -d dist/lib/arm64-v8a/libvkshim.so | tee dist/shim_dynamic.txt
          $READELF --dyn-syms dist/lib/arm64-v8a/libvkshim.so | grep -c " vk" | tee dist/exported_vk_count.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vkshim-arm64
          path: dist
